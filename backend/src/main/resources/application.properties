spring.application.name=backend

# Profils : « dev » en local (H2 sur disque), « prod » sur le Raspberry Pi (PostgreSQL, deploiement/raspberry-pi).
# Aucun profil par défaut : sans profil, les réglages « mine.* » manquent et le serveur refuse de démarrer.

# ─── Réponses d'erreur ──────────────────────────────────────────────────────
# Aucune information interne dans les réponses : ni trace, ni message d'exception, ni détail de validation.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=true

# Console H2 désactivée : elle donnerait un accès direct à la base
spring.h2.console.enabled=false

# ─── Base de données ────────────────────────────────────────────────────────
# Le schéma vient uniquement de Flyway (db/migration) ; Hibernate vérifie qu'il correspond aux entités.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.session.jdbc.initialize-schema=never

# ─── Session ────────────────────────────────────────────────────────────────
# Cookie de session : nom, HttpOnly, SameSite=Lax et Secure posés dans SecurityConfig (sessionCookieSerializer).
# Session anonyme (jeton CSRF demandé par un visiteur, connexion Google en cours) : 30 minutes, pour qu'une rafale
# de visiteurs ne remplisse pas la base de sessions qui dureraient 14 jours.
spring.session.timeout=30m
# Joueur connecté : déconnexion après 14 jours sans venir (posé à la connexion par SecurityConfig) ;
# la durée maximale (60 jours) est appliquée par SessionLifetimeFilter.
mine.session.idle-timeout=14d
mine.session.max-lifetime=60d
# Cookie envoyé seulement en HTTPS
mine.session.secure-cookie=true

# ─── Connexion Google (OpenID Connect) ──────────────────────────────────────
# Seulement « openid » : on ne reçoit ni e-mail ni nom, seul l'identifiant Google opaque du compte (minimisation RGPD).
# Identifiants à fournir par variables d'environnement, jamais dans le dépôt.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid

# ─── Supervision ────────────────────────────────────────────────────────────
# Seul l'état de santé est exposé, sans détail (base, disque…)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ─── Limites ────────────────────────────────────────────────────────────────
# Corps de requête refusé au-delà (une sauvegarde complète pèse quelques dizaines de Ko)
mine.limits.max-body-bytes=524288
mine.rate-limit.login-per-minute=10
mine.rate-limit.write-per-minute=30
mine.rate-limit.read-per-minute=120

# ─── Anti-triche (plausibilité) ─────────────────────────────────────────────
# Date de mise en ligne du jeu : une première sauvegarde ne peut pas dépasser ce qu'un joueur sans pause aurait atteint depuis.
mine.anti-cheat.release-date=2026-10-11T00:00:00Z
# Un joueur peut aller jusqu'à ce facteur plus vite que le joueur simulé qui joue sans arrêt, plus une marge fixe
mine.anti-cheat.speed-factor=2
mine.anti-cheat.grace=15m

# ─── Discussion ─────────────────────────────────────────────────────────────
# Modérateurs de la discussion : identifiants de joueurs séparés par des virgules (MINE_MODERATORS), aucun par défaut
mine.chat.moderators=${MINE_MODERATORS:}
