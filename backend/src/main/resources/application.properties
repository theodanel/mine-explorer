spring.application.name=backend

# ─── Sécurité par défaut ────────────────────────────────────────────────────
# Le serveur n'expose encore aucune route : le jeu tourne entièrement dans le navigateur.
# Ces réglages préparent la suite : aucune information interne dans les réponses d'erreur.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Console H2 désactivée : elle donnerait un accès direct à la base
spring.h2.console.enabled=false

# Pas de requêtes SQL pendant le rendu des vues
spring.jpa.open-in-view=false
