# Service du jeu en local (docker compose). Reprend les en-têtes de sécurité de public/_headers (Cloudflare Pages),
# sauf HSTS et upgrade-insecure-requests : le compose sert en HTTP sur localhost, ils casseraient le chargement.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pas de version de nginx dans les réponses
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Application monopage : toute route inconnue renvoie au jeu
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers versionnés par le build Angular : gardés en cache longtemps
    location ~* \.(?:js|css|webp|png|ogg|mp3|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
