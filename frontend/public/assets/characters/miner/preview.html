      currentAnim._maxBboxW = Math.max(1, maxW);
      currentAnim._maxBboxH = Math.max(1, maxH);
      metaEl.textContent = currentGroup.key + ' · ' + name + ' · ' + a.frames.length + ' frames · default fps ' + fps + (a.loop === false ? ' · one-shot' : ' · looped');
    }

    animSel.addEventListener('change', () => setAnim(animSel.value));
    fpsInp.addEventListener('input', () => { fps = +fpsInp.value; fpsVal.textContent = fpsInp.value; });
    scaleInp.addEventListener('input', () => { scale = +scaleInp.value; scaleVal.textContent = scale + '×'; });
    loopBtn.addEventListener('click', () => { loop = !loop; loopBtn.textContent = 'Loop: ' + (loop ? 'on' : 'off'); });
    playBtn.addEventListener('click', () => { playing = !playing; playBtn.textContent = playing ? '⏸ Pause' : '▶ Play'; });

    setGroup(GROUPS[0]);
    requestAnimationFrame(tick);

    function tick(t) {
      requestAnimationFrame(tick);
      const img = sheetCache.get(currentGroup.key);
      if (!img || img instanceof Error || !currentAnim) return;
      const interval = 1000 / fps;
      if (playing && t - last >= interval) {
        last = t;
        frameIdx++;
        if (frameIdx >= currentAnim.frames.length) {
          if (loop || currentAnim.loop !== false) frameIdx = 0;
          else { frameIdx = currentAnim.frames.length - 1; playing = false; playBtn.textContent = '▶ Play'; }
        }
      }
      drawFrame(img);
    }

    function drawFrame(img) {
      const name = currentAnim.frames[frameIdx];
      const f = currentGroup.atlas.frames[name];
      if (!f) return;
      const src = f.frame;
      const sss = f.spriteSourceSize || { x: 0, y: 0, w: src.w, h: src.h };
      // Canvas is sized to the animation's TIGHT max bounding box (not the
      // atlas cell's sourceSize) so the canvas hugs the character and stays
      // stable across frames. Each frame's trimmed content is drawn centered
      // within that box.
      //
      // IMPORTANT: SpriteShip atlases store the FULL cell (with transparent
      // padding) in 'frame', and use 'spriteSourceSize' (sss) to mark where
      // the actual character is within that cell. So the drawImage crop must
      // be offset by sss.x/sss.y, and use sss.w/sss.h (not src.w/src.h) for
      // both the source crop size AND the destination size.
      const maxBboxW = currentAnim._maxBboxW || sss.w;
      const maxBboxH = currentAnim._maxBboxH || sss.h;
      const cw = maxBboxW * scale;
      const ch = maxBboxH * scale;
      if (cv.width !== Math.ceil(cw) || cv.height !== Math.ceil(ch)) {
        cv.width = Math.ceil(cw);
        cv.height = Math.ceil(ch);
      }
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.imageSmoothingEnabled = false;
      const sx = src.x + sss.x;
      const sy = src.y + sss.y;
      const sw = sss.w;
      const sh = sss.h;
      const drawX = Math.round((cw - sw * scale) / 2);
      const drawY = Math.round((ch - sh * scale) / 2);
      ctx.drawImage(
        img,
        sx, sy, sw, sh,
        drawX, drawY, sw * scale, sh * scale,
      );
    }
  })();
  </script>
</body>
</html>
