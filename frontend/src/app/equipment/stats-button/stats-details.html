<section class="dialog game-panel" data-theme="gold" role="dialog" aria-modal="true" aria-labelledby="stats-details-title">
  <header class="page-header">
    <h2 id="stats-details-title">Détails des stats</h2>
  </header>
  <!-- La Puissance en vedette, comme le « CP » des jeux du genre : le chiffre qu'on veut voir monter -->
  <p class="power">
    <span class="power-label">Puissance</span>
    <strong class="power-value">{{ power() }}</strong>
  </p>
  <h3>Stats de base</h3>
  <app-stats-panel />
  @if (sources().length > 0) {
    <h3>Bonus</h3>
    <dl class="sources">
      @for (source of sources(); track source.label) {
        <div class="source">
          <dt>{{ source.label }}</dt>
          @for (line of source.lines; track line) {
            <dd>{{ line }}</dd>
          }
        </div>
      }
    </dl>
  }
</section>
