# Configuration Fly.io du serveur (voir docs/technique/backend.md, « Mise en ligne »).
# Le nom de l'appli est réservé à la création par `fly apps create` ; le changer ici s'il est déjà pris.
app = "mine-explorer-api"
# Paris
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  # Une machine toujours allumée : Spring Boot met plusieurs secondes à démarrer, et la limite de requêtes
  # vit en mémoire (une seule machine = un seul compteur)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
