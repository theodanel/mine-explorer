<div class="frame">
  <div #stage class="stage"></div>
  <!-- Zone du rocher, invisible : le tutoriel l'entoure pour présenter le filon -->
  <div
    class="rock-zone"
    data-tuto="rock"
    aria-hidden="true"
    [style.left.%]="healthBarLeft()"
    [style.top.%]="rockZoneTop()"
  ></div>
  <div
    class="health"
    role="progressbar"
    aria-label="Résistance du filon"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="healthPercent()"
    [style.left.%]="healthBarLeft()"
    [style.top.%]="healthBarTop()"
  >
    <div class="health-fill" [style.width.%]="healthPercent()"></div>
    <span class="health-label">{{ remaining() }} PV</span>
  </div>
</div>
