# Lance Mine Explorer en local : le jeu (Angular servi par nginx) et le serveur Spring Boot.
#   cp .env.example .env    (une fois, pour changer les ports si besoin)
#   docker compose up --build
# Le jeu : http://localhost:8080 · le serveur : http://localhost:8081
# Voir docs/technique/docker.md.

name: mine-explorer

services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    # Moindre privilège : système de fichiers en lecture seule, aucune capacité Linux, pas d'élévation
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    restart: unless-stopped
    environment:
      # Mémoire de la JVM ajustée à celle du conteneur
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
