<!-- Seuls les menus ouverts ont leur onglet : chacun surgit à son ouverture -->
<nav class="footer" aria-label="Menus du jeu">
  @for (tab of tabs(); track tab.label) {
    <span class="tab-wrapper" [appReveal]="tab.reveal">
      <button
        type="button"
        class="tab"
        [class.current]="currentTab() === tab.page"
        [attr.aria-current]="currentTab() === tab.page ? 'page' : null"
        (click)="open(tab)"
      >
        @if (tab.icon; as icon) {
          <img class="tab-icon" [src]="icon" alt="" width="160" height="160" />
        } @else {
          <span class="tab-icon" aria-hidden="true"></span>
        }
        <span class="tab-label">{{ tab.label }}</span>
        @if (tab.badge > 0) {
          <span class="badge" [attr.aria-label]="tab.badge + ' nouveauté(s)'">{{ tab.badge }}</span>
        }
      </button>
    </span>
  }
</nav>
