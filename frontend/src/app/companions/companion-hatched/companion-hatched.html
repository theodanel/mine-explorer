@if (view(); as view) {
  <div class="backdrop" (click)="companions.dismissHatching()">
    <section
      class="dialog game-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="companion-hatched-title"
      [attr.data-rarity]="view.rarity"
      (click)="$event.stopPropagation()"
    >
      <p class="headline">{{ view.headline }}</p>
      <span class="rays"><img class="hatched-icon" [src]="view.icon" alt="" width="200" height="200" /></span>
      <h2 id="companion-hatched-title">{{ view.label }}</h2>
      <p class="rarity">{{ view.rarityLabel }} · {{ view.stars }} ★</p>
      @if (view.kind === 'duplicate') {
        <p class="description">Ce doublon se change en {{ view.stones }} pierres d'éveil : elles font monter ses étoiles.</p>
      } @else {
        <p class="description">{{ view.description }}</p>
      }
      <button type="button" class="game-button green" (click)="companions.dismissHatching()">Super !</button>
    </section>
  </div>
}
