<div class="frame">
  <div #stage class="stage"></div>
  <!-- Zone du rocher, invisible : le tutoriel l'entoure pour présenter le filon -->
  <div
    class="rock-zone"
    data-tuto="rock"
    aria-hidden="true"
    [style.left.%]="healthBarLeft()"
    [style.top.%]="rockZoneTop()"
  ></div>
  @if (guardian()) {
    <!-- Combat contre le gardien : le chrono s'affiche au-dessus de sa vie -->
    <div class="guardian-timer" [class.urgent]="guardianSeconds() <= 10" [style.left.%]="healthBarLeft()" [style.top.%]="healthBarTop()" role="timer">
      <span class="guardian-name">Gardien</span>
      <span class="timer-bar"><span class="timer-fill" [style.width.%]="guardianTimePercent()"></span></span>
      <span class="timer-value">{{ guardianSeconds() }} s</span>
    </div>
  }
  @if (canChallenge()) {
    <button type="button" class="challenge game-button red" [style.top.%]="healthBarTop()" (click)="challengeGuardian()">
      Défier le gardien
      <small>Puissance conseillée {{ guardianPower() }}</small>
    </button>
  }
  <div
    class="health"
    [class.guardian]="guardian()"
    role="progressbar"
    aria-label="Résistance du filon"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="healthPercent()"
    [style.left.%]="healthBarLeft()"
    [style.top.%]="healthBarTop()"
  >
    <div class="health-fill" [style.width.%]="healthPercent()"></div>
    <span class="health-label">{{ remaining() }} PV</span>
  </div>
</div>
