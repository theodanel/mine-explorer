<section class="page game-panel" aria-labelledby="adventures-title">
  <header class="page-header">
    <h2 id="adventures-title">Aventures</h2>
    <button type="button" class="close" aria-label="Revenir à la mine" (click)="close()">×</button>
  </header>

  <ul class="cards">
    @for (adventure of adventures(); track adventure.page) {
      <li>
        <button
          type="button"
          class="card"
          [class.locked]="adventure.locked !== null"
          [disabled]="adventure.locked !== null"
          [style.background-image]="adventure.scene"
          (click)="open(adventure)"
        >
          <span class="shade" aria-hidden="true"></span>
          <img class="card-icon" [src]="adventure.icon" alt="" width="192" height="192" />
          <span class="card-text">
            <strong>{{ adventure.title }}</strong>
            <span class="pitch">{{ adventure.text }}</span>
            @if (adventure.locked; as locked) {
              <span class="chip lock">Débloqué : {{ locked }}</span>
            } @else if (adventure.status; as status) {
              <span class="chip ready">{{ status }}</span>
            }
          </span>
          @if (adventure.locked === null) {
            <span class="go" aria-hidden="true">Entrer</span>
          }
        </button>
      </li>
    }
  </ul>
</section>
