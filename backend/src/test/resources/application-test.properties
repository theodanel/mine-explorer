# Tests : H2 en mémoire en mode PostgreSQL, mêmes migrations Flyway qu'en production
spring.datasource.url=jdbc:h2:mem:mine-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Faux identifiants : aucun appel à Google pendant les tests
spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret

mine.front.url=https://mine.example.test
mine.front.allowed-origins=https://mine.example.test

# Limites larges : seul RateLimitTests les resserre
mine.rate-limit.login-per-minute=1000
mine.rate-limit.write-per-minute=1000
mine.rate-limit.read-per-minute=1000

# Modérateur de la discussion pour les tests (ChatApiTests crée ce joueur)
mine.chat.moderators=00000000-0000-0000-0000-00000000000a
