# Profil de production (Fly.io). Variables d'environnement attendues, sans valeur par défaut :
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD (compte limité aux données)
#   SPRING_FLYWAY_USER, SPRING_FLYWAY_PASSWORD (compte propriétaire du schéma, pour les migrations)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# Détails : docs/technique/backend.md

# Fly.io termine le HTTPS et transmet X-Forwarded-Proto : nécessaire pour construire l'URL de retour Google en https
server.forward-headers-strategy=framework
# Adresse réelle du joueur posée par le proxy de Fly.io, utilisée par la limite de requêtes
mine.rate-limit.client-ip-header=Fly-Client-IP

mine.front.url=https://mine.bouncylab.ovh
mine.front.allowed-origins=https://mine.bouncylab.ovh
