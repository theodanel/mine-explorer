# Intégration et déploiement continus de Mine Explorer.
# Sur chaque PR et chaque push sur main : lint, tests, build et audit du frontend ; build et tests du backend ;
# construction et démarrage de l'image du jeu, et du serveur avec sa base tel qu'il tourne sur le Raspberry Pi.
# Sur une PR verte de Théo, ou de Dependabot en version mineure ou corrective : fusion automatique.
# Sur main uniquement, quand tout est vert : déploiement du frontend sur Cloudflare Pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Relancé par la fusion automatique : une fusion faite avec le jeton de la CI ne déclenche pas « push »
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut, chaque job ne reçoit que ce dont il a besoin
permissions:
  contents: read

# Un nouveau push annule l'exécution précédente de la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances (versions du lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests unitaires et couverture
        run: npx ng test --watch=false --coverage
      - name: Build de production
        run: npm run build
      - name: Audit des dépendances (échoue sur une faille haute ou critique)
        run: npm audit --audit-level=high
      - name: Garder le build pour le déploiement
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          retention-days: 7
          if-no-files-found: error

  backend:
    name: Backend (build et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build et tests
        run: sh ./mvnw -B -ntp verify

  docker:
    name: Docker (images et démarrage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Construire les images
        run: docker compose build
      # Démarrage réel : le jeu répond, puis tout s'arrête
      - name: Démarrer et vérifier
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ > /dev/null && break; sleep 2; done
          curl -fsS http://localhost:8080/ | grep -q "<app-root"
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q frontend)")" = healthy ] && break; sleep 2; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q frontend)")" = healthy ]
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Arrêter
        if: always()
        run: docker compose down
      # Le serveur du Raspberry Pi (deploiement/raspberry-pi), ici en amd64 : même image Ubuntu + OpenJDK 21, même
      # base PostgreSQL et même compte limité. Il démarre en profil prod (migrations Flyway, schéma validé par Hibernate)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Serveur du Pi · jar
        working-directory: backend
        run: sh ./mvnw -B -ntp package -DskipTests && cp target/backend-*.jar ../deploiement/raspberry-pi/backend/app.jar
      - name: Serveur du Pi · démarrer et vérifier
        working-directory: deploiement/raspberry-pi
        run: |
          docker network create --subnet 172.30.0.0/24 proxy
          # Secrets jetables, seulement pour ce test : Google n'est pas appelé au démarrage
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "MINE_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "GOOGLE_CLIENT_ID=ci"
            echo "GOOGLE_CLIENT_SECRET=ci"
          } > .env
          docker compose up -d --build
          for i in $(seq 1 60); do docker compose logs backend | grep -q "Started BackendApplication" && break; sleep 3; done
          docker compose logs backend | grep -q "Started BackendApplication"
          # Le compte de l'appli ne peut pas toucher au schéma
          ! docker compose exec -T db psql -U mine_app -d mine -c 'CREATE TABLE intrus (id int)' 2>/dev/null
      - name: Serveur du Pi · journaux en cas d'échec
        if: failure()
        working-directory: deploiement/raspberry-pi
        run: docker compose logs
      - name: Serveur du Pi · arrêter
        if: always()
        working-directory: deploiement/raspberry-pi
        run: docker compose down -v || true

  automerge:
    name: Fusion automatique
    needs: [frontend, backend, docker]
    # Seulement les PR de ce dépôt, prêtes (pas en brouillon), sans le label qui la bloque, de Théo ou de Dependabot
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'pas-de-fusion-auto') &&
      (github.event.pull_request.user.login == 'theodanel' || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Lire le type de mise à jour Dependabot
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v2
      # Une version majeure (Angular, PixiJS, une action) peut casser le jeu même avec des tests verts : relecture manuelle
      - name: Fusionner
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --merge --delete-branch
      - name: Lancer le déploiement de main
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"

  deploy:
    name: Déploiement sur Cloudflare Pages
    needs: [frontend, backend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environnement GitHub « production » : ses secrets ne sont lisibles que par ce job
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
      - name: Publier
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main
