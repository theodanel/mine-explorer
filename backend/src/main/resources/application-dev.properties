# Profil local : ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Base H2 sur disque dans backend/data/ (ignoré par git), en mode compatible PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/mine;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# http://localhost n'a pas de HTTPS : le cookie « Secure » ne serait pas renvoyé par tous les navigateurs
mine.session.secure-cookie=false

# Sans identifiants Google, le serveur démarre quand même ; seule la connexion échoue.
# Pour la tester : GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET dans l'environnement (voir docs/technique/backend.md).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:non-configure}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:non-configure}

mine.front.url=http://localhost:4200
mine.front.allowed-origins=http://localhost:4200
