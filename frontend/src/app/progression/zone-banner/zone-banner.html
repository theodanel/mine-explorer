<section class="banner" aria-label="Avancée dans la mine">
  <h2
    class="label"
    tabindex="0"
  >
    Zone {{ progression.zone() }}
    <span class="stage">Filon {{ progression.progress().stage }} / {{ stagesPerZone }}</span>
  </h2>
  @if (galleries.offer() !== null) {
    <button type="button" class="gallery choose" (click)="galleries.reopenDialog()">Choisir la galerie</button>
  } @else if (galleries.current() !== 'neutral') {
    <span class="gallery" tabindex="0" [appTooltip]="galleryTooltip()">
      <img [src]="galleryIcon()" alt="" width="161" height="149" />
      {{ galleries.gallery().label }}
    </span>
  }
</section>
