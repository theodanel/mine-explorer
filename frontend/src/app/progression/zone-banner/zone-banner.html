<section class="banner" aria-label="Avancée dans la mine">
  <!-- Toucher la zone ouvre la carte des zones -->
  <h2 class="title">
    <button type="button" class="label" aria-label="Ouvrir la carte des zones" (click)="openMap()">
      @if (progression.farmZone(); as farm) {
        Zone {{ farm }}
        <span class="stage">Filons sans fin</span>
      } @else {
        Zone {{ progression.zone() }}
        @if (progression.progress().stage === stagesPerZone) {
          <span class="stage">Gardien</span>
        } @else {
          <span class="stage">Filon {{ progression.progress().stage }} / {{ stagesPerZone }}</span>
        }
      }
      <span class="map-hint" aria-hidden="true">▾</span>
    </button>
  </h2>
  @if (progression.farmZone() !== null) {
    <button type="button" class="resume" (click)="progression.stopFarm()">Reprendre la zone {{ progression.zone() }}</button>
  } @else if (progression.blocked()) {
    <!-- Gardien raté : un rappel discret pour le défier à nouveau -->
    <button type="button" class="challenge" (click)="challengeGuardian()">
      Défier le gardien <span class="power">· Puissance {{ guardianPower() }}</span>
    </button>
  }
  @if (galleries.offer() !== null) {
    <button type="button" class="gallery choose" (click)="galleries.reopenDialog()">Choisir la galerie</button>
  } @else if (galleries.current() !== 'neutral') {
    <span class="gallery" tabindex="0" [appTooltip]="galleryTooltip()">
      <img [src]="galleryIcon()" alt="" width="161" height="149" />
      {{ galleries.gallery().label }}
    </span>
  }
</section>
