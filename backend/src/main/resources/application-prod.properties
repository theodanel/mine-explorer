# Profil de production : Raspberry Pi de Théo, derrière Nginx Proxy Manager (voir deploiement/raspberry-pi).
# Variables d'environnement attendues, sans valeur par défaut :
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD (compte limité aux données)
#   SPRING_FLYWAY_USER, SPRING_FLYWAY_PASSWORD (compte propriétaire du schéma, pour les migrations)
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# Détails : docs/technique/backend.md

# Nginx Proxy Manager termine le HTTPS et transmet X-Forwarded-For et X-Forwarded-Proto. Tomcat (RemoteIpValve)
# ne les croit que s'ils viennent du proxy : la requête est alors vue comme HTTPS (cookie Secure, HSTS) et l'adresse
# de la connexion devient celle du joueur, utilisée par la limite de requêtes. Seul le réseau Docker « proxy »
# (172.30.0.0/24, créé une fois sur le Pi) est digne de confiance : une requête venue d'ailleurs garde son adresse
# réelle, quels que soient les en-têtes qu'elle invente.
server.forward-headers-strategy=native
# Dans un fichier .properties, « \\ » donne une barre oblique inverse : l'expression lue est 172\.30\.0\.\d{1,3}
server.tomcat.remoteip.internal-proxies=172\\.30\\.0\\.\\d{1,3}

# Adresses du jeu et de l'API : celles de la production par défaut ; le serveur de test (staging) les remplace par
# MINE_FRONT_URL et MINE_API_URL (deploiement/raspberry-pi/.env)
mine.front.url=${MINE_FRONT_URL:https://mine.bouncylab.ovh}
mine.front.allowed-origins=${MINE_FRONT_URL:https://mine.bouncylab.ovh}

# Adresse de retour Google fixe : sans elle, Spring la construit à partir des en-têtes X-Forwarded-* de la requête,
# qu'un client peut remplir lui-même si le proxy ne les écrase pas
spring.security.oauth2.client.registration.google.redirect-uri=${MINE_API_URL:https://api.bouncylab.ovh}/login/oauth2/code/{registrationId}
