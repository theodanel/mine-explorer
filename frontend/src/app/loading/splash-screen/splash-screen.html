@if (visible()) {
  <section class="splash" [class.leaving]="leaving()" aria-label="Chargement du jeu">
    <img class="background" src="assets/ui/splash-bg.webp" alt="" width="720" height="1290" />
    <img class="logo" src="assets/ui/logo.webp" alt="Mine Explorer" width="1000" height="407" />

    <div
      class="bar"
      role="progressbar"
      aria-label="Chargement"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="percent()"
    >
      <div class="bar-fill" [style.width.%]="percent()"></div>
    </div>
    <p class="bar-label">
      @if (loader.state() === 'failed') {
        Chargement impossible, recharge la page
      } @else {
        Chargement… {{ percent() }} %
      }
    </p>
  </section>
}
